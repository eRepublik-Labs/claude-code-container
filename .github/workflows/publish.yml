name: Publish Container Image

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].*'  # CalVer: YYYY.MM.PATCH
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes
        id: release_notes
        run: |
          # Get release notes from the tag (first 3 lines, preserve dashes)
          # Replace problematic characters for Docker buildx: remove pipes, escape quotes
          NOTES=$(gh release view ${{ github.ref_name }} --json body --jq '.body' 2>/dev/null | grep -E '^-' | head -n 3 | tr '\n' ' ' | sed 's/|//g' || echo "")
          # Use heredoc to properly handle special characters in GitHub Actions output
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=\d+\.\d+\.\d+,group=0
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Claude Code Secure Container
            org.opencontainers.image.description=Secure, isolated container environment for Claude Code development with strict network firewall
            org.opencontainers.image.authors=eRepublik Labs
            org.opencontainers.image.source=https://github.com/eRepublik-Labs/claude-code-container
            org.opencontainers.image.documentation=https://github.com/eRepublik-Labs/claude-code-container/blob/main/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/eRepublik-Labs/claude-code-container
            com.erepubliklabs.release-notes=${{ steps.release_notes.outputs.notes }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CONTAINER_VERSION=${{ steps.meta.outputs.version }}
            RELEASE_NOTES=${{ steps.release_notes.outputs.notes }}
          outputs: 'type=image,name=target,annotation-index.org.opencontainers.image.description=Secure isolated container environment for Claude Code development with strict network firewall'
          cache-from: type=registry,ref=${{ env.REGISTRY }}/erepublik-labs/claude-code-container:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/erepublik-labs/claude-code-container:buildcache,mode=max

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Security Scanning and Supply Chain Features

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail workflow on CRITICAL or HIGH CVEs
          scanners: 'vuln'
          # Focus on packages we control (Alpine, npm, Python)
          # Skip Go binaries (Claude Code) - managed by Anthropic
          skip-files: '/home/dev/.local/**,/usr/local/bin/claude,/usr/bin/gh'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false           # Disable automatic artifact upload
          upload-release-assets: false     # Disable automatic release upload

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Run Trivy for SARIF output
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          scanners: 'vuln'
          skip-files: '/home/dev/.local/**,/usr/local/bin/claude,/usr/bin/gh'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload security reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ steps.meta.outputs.version }}
          path: |
            trivy-results.json
            trivy-results.sarif
            sbom.spdx.json
          retention-days: 90

      - name: Set package visibility to public
        run: |
          PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          ORG_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)

          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${ORG_NAME}/packages/container/${PACKAGE_NAME}" \
            -d '{"visibility":"public"}'
